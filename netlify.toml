[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fingerprinted build assets never change: cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Old-site URLs (mw-tennis-data used /post.html?id=<id>) → new posts
[[redirects]]
  from = "/post.html"
  to = "/posts/sine-of-a-great-serve"
  query = { id = "sine-of-a-great-serve" }
  status = 301
  force = true

[[redirects]]
  from = "/post.html"
  to = "/posts/out-wide-out-wider"
  query = { id = "out-wide-out-wider" }
  status = 301
  force = true

